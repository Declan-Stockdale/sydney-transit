<!doctype html>
<!-- Animated replay of every train, bus, ferry and light rail vehicle, embedded by the "Live replay" page of
     streamlit_app.py. The page swaps __SEGMENTS__ for the rail network (segments.csv rows). Vehicle data is
     fetched per mode from app/static/replay/<mode>.json (built by analysis/replay.py) only when that mode is
     switched on. Everything animates in the browser, so Streamlit doesn't rerun for each frame. -->
<html>
<head>
<meta charset="utf-8">
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<style>
  body {margin: 0; font-family: "Source Sans Pro", sans-serif; color: #33322f;}
  #wrap {position: relative; height: 640px; border: 1px solid #e4e3df; border-radius: 10px; overflow: hidden;}
  #map {position: absolute; inset: 0;}
  .panel {position: absolute; background: rgba(255,255,255,0.94); border: 1px solid #e4e3df; border-radius: 8px;
          padding: 10px 12px; font-size: 13px; z-index: 2;}
  #modes {top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px;}
  #modes b {margin-right: 4px;}
  .chip {border: 1px solid #c9c7c1; background: #fff; color: #33322f; border-radius: 999px; padding: 4px 11px;
         font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;}
  .chip.on {background: #2a78d6; border-color: #2a78d6; color: #fff;}
  .chip .n {opacity: 0.8; font-size: 12px;}
  .chip.loading .n::after {content: "loading…";}
  .chip.missing {opacity: 0.45; cursor: default;}
  .link {border: none; background: none; color: #2a78d6; cursor: pointer; font-size: 13px; padding: 4px 6px;}
  #clock {top: 62px; left: 10px;}
  #clock .t {font-size: 26px; font-weight: 600; line-height: 1.1;}
  #clock .d {color: #6b6a66;}
  #clock .gap {color: #b5470b; font-weight: 600; margin-top: 4px;}
  #legend {top: 62px; right: 10px;}
  #legend div {display: flex; align-items: center; gap: 6px; margin: 2px 0;}
  #legend i {width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-sizing: border-box;}
  #legend label {display: block; margin-top: 6px;}
  #controls {left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px;}
  #controls button {width: 74px; padding: 5px 0; border: 1px solid #2a78d6; background: #2a78d6; color: #fff;
                    border-radius: 6px; font-size: 14px; cursor: pointer;}
  #slider {flex: 1;}
  #controls select {padding: 3px;}
  #credit {position: absolute; right: 12px; bottom: 62px; font-size: 10px; color: #6b6a66; z-index: 2;}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="credit">Basemap: Esri, HERE, Garmin, &copy; OpenStreetMap contributors</div>
  <div id="modes" class="panel"><b>Show</b><span id="chips"></span>
    <button class="link" id="all">All</button><button class="link" id="none">None</button></div>
  <div id="clock" class="panel"><div class="t" id="time"></div><div class="d" id="date"></div>
    <div id="count"></div><div class="gap" id="gap"></div></div>
  <div id="legend" class="panel">
    <b>Running</b>
    <div><i style="background:#2a78d6"></i>On time or early (under 1 min late)</div>
    <div><i style="background:#e0a526"></i>1 to 3 min late</div>
    <div><i style="background:#e0702a"></i>3 to 5 min late</div>
    <div><i style="background:#c0392b"></i>5+ min late</div>
    <div><i style="background:#fff;border:1.5px solid #8c8a84"></i>No delay data</div>
    <div><i style="background:#b9b7b1"></i>Out of service (empty run)</div>
    <label><input type="checkbox" id="oos"> Show out of service</label>
    <div style="color:#6b6a66;margin-top:6px">Bigger dots: ferries and trains.<br>Smallest: buses.</div>
  </div>
  <div id="controls" class="panel">
    <button id="play">Play</button>
    <input type="range" id="slider" step="1">
    <select id="speed" title="Playback speed">
      <option value="60">1 min / s</option>
      <option value="300" selected>5 min / s</option>
      <option value="900">15 min / s</option>
      <option value="1800">30 min / s</option>
    </select>
  </div>
</div>
<script>
const SEG = __SEGMENTS__;
const MAX_GAP = 300;  // only draw a vehicle between GPS fixes under 5 minutes apart (matches analysis/replay.py)
const UNKNOWN = 9999;  // "minutes late x 10" value for no delay data (matches analysis/replay.py)
// Drawn in this order, so buses sit underneath everything else
const MODES = [
// maxKmh / minJumpKm: top speed and shortest move treated as a glitch, matching SPEED_LIMITS in analysis/replay.py
  {mode: "Bus", file: "bus", label: "Buses", r: 3, maxKmh: 110, minJumpKm: 0.5},
  {mode: "Light rail", file: "light_rail", label: "Light rail", r: 4.5, maxKmh: 80, minJumpKm: 0.3},
  {mode: "Ferry", file: "ferry", label: "Ferries", r: 6, maxKmh: 60, minJumpKm: 0.3},
  {mode: "TrainLink", file: "trainlink", label: "NSW TrainLink", r: 5, maxKmh: 160, minJumpKm: 1},
  {mode: "Metro", file: "metro", label: "Metro", r: 5, maxKmh: 160, minJumpKm: 1},
  {mode: "Trains", file: "trains", label: "Sydney Trains", r: 5, maxKmh: 160, minJumpKm: 1},
];
const state = Object.fromEntries(MODES.map(m => [m.mode, {on: true, trips: null, status: "idle", start: 0, end: 0}]));

// Unpack one mode's file: delta-encoded integers -> typed arrays per trip (t in epoch seconds)
function unpack(m, R) {
  return R.trips.map(([li, oos, p]) => {
    const n = p.length / 4, t = new Float64Array(n), lon = new Float64Array(n), lat = new Float64Array(n), late = new Float32Array(n);
    let x = 0, y = 0, s = R.start;
    for (let i = 0; i < n; i++) {
      x += p[4 * i]; y += p[4 * i + 1]; s += p[4 * i + 2];
      lon[i] = x / 1e4; lat[i] = y / 1e4; t[i] = s; late[i] = p[4 * i + 3] === UNKNOWN ? NaN : p[4 * i + 3] / 10;
    }
    return {line: R.lines[li], mode: m.mode, r: m.r, oos: !!oos, t, lon, lat, late};
  });
}

async function load(m) {
  const st = state[m.mode];
  if (st.status !== "idle") return;
  st.status = "loading"; drawChips();
  try {
    const resp = await fetch(`/app/static/replay/${m.file}.json`);
    if (!resp.ok) throw new Error(resp.status);
    st.trips = unpack(m, await resp.json());
    st.start = Math.min(...st.trips.map(tr => tr.t[0]));
    st.end = Math.max(...st.trips.map(tr => tr.t[tr.t.length - 1]));
    st.status = "ready";
  } catch (e) {
    st.status = "missing"; st.on = false;
  }
  rebuildTimeline(); drawChips(); render();
}

// Overall time range and GPS fixes per minute over the modes loaded, so playback skips collection gaps
let t0 = 0, t1 = 0, covered = new Uint32Array(0);
function rebuildTimeline() {
  const ready = MODES.map(m => state[m.mode]).filter(st => st.status === "ready");
  if (!ready.length) return;
  const first = !t1;
  t0 = Math.min(...ready.map(st => st.start)); t1 = Math.max(...ready.map(st => st.end));
  covered = new Uint32Array(Math.ceil((t1 - t0) / 60) + 2);
  ready.forEach(st => st.trips.forEach(tr => tr.t.forEach(s => covered[Math.floor((s - t0) / 60)]++)));
  slider.min = t0; slider.max = t1;
  if (first) now = startTime();
  now = Math.min(Math.max(now, t0), t1);
}
function nextCovered(s, minFixes = 1) {
  for (let m = Math.floor((s - t0) / 60); m < covered.length; m++) if (covered[m] >= minFixes) return Math.max(s, t0 + m * 60);
  return t1;
}
// Start a minute in, once every vehicle has had its first fix (and skip any stray early fixes)
const startTime = () => Math.min(nextCovered(t0, 20) + 60, t1);

function positionsAt(s, showOos) {
  const out = [];
  for (const m of MODES) {
    const st = state[m.mode];
    if (!st.on || st.status !== "ready") continue;
    for (const tr of st.trips) {
      if (tr.oos && !showOos) continue;
      const t = tr.t, n = t.length;
      if (s < t[0] || s > t[n - 1]) continue;
      let lo = 0, hi = n - 1;  // last fix at or before s
      while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (t[mid] <= s) lo = mid; else hi = mid - 1; }
      if (lo === n - 1) { out.push({tr, lon: tr.lon[lo], lat: tr.lat[lo], late: tr.late[lo]}); continue; }
      const gap = t[lo + 1] - t[lo];
      if (gap > MAX_GAP) continue;
      // Don't glide across a move nothing could make (leftover GPS error): hold, then snap to the next fix
      const km = Math.hypot((tr.lon[lo + 1] - tr.lon[lo]) * 92.5, (tr.lat[lo + 1] - tr.lat[lo]) * 110.6);
      const f = km > m.minJumpKm && km / gap * 3600 > m.maxKmh ? 0 : (s - t[lo]) / gap;
      out.push({tr, lon: tr.lon[lo] + f * (tr.lon[lo + 1] - tr.lon[lo]),
                lat: tr.lat[lo] + f * (tr.lat[lo + 1] - tr.lat[lo]), late: tr.late[lo]});
    }
  }
  return out;
}

function colour(d) {
  if (d.tr.oos) return [185, 183, 177, 200];
  if (Number.isNaN(d.late)) return [255, 255, 255, 230];
  if (d.late < 1) return [42, 120, 214, 230];
  if (d.late < 3) return [224, 165, 38, 240];
  if (d.late < 5) return [224, 112, 42, 240];
  return [192, 57, 43, 250];
}
const outline = d => Number.isNaN(d.late) && !d.tr.oos ? [140, 138, 132] : [255, 255, 255];

const fmtTime = new Intl.DateTimeFormat("en-AU", {timeZone: "Australia/Sydney", hour: "numeric", minute: "2-digit"});
const fmtDate = new Intl.DateTimeFormat("en-AU", {timeZone: "Australia/Sydney", weekday: "long", day: "numeric", month: "long"});

const network = new deck.LineLayer({
  id: "network", data: SEG, getSourcePosition: d => [d.a_lon, d.a_lat], getTargetPosition: d => [d.b_lon, d.b_lat],
  getColor: d => d.mode === "Metro" ? [22, 131, 136, 110] : [120, 120, 120, 90], getWidth: 2, widthUnits: "pixels",
});

// Esri light grey raster basemap (no API key; Carto tiles now need one), as deck.gl tiles so no separate map library is needed
const basemap = new deck.TileLayer({
  id: "basemap", data: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  minZoom: 0, maxZoom: 16, tileSize: 256,
  renderSubLayers: props => {
    const {west, south, east, north} = props.tile.bbox;
    return new deck.BitmapLayer(props, {data: null, image: props.data, bounds: [west, south, east, north]});
  },
});

const map = new deck.DeckGL({
  container: "map",
  initialViewState: {latitude: -33.84, longitude: 151.0, zoom: 9.2},
  controller: true,
  getTooltip: ({object}) => {
    if (!object) return null;
    const {tr, late} = object, name = tr.mode === "Bus" ? `Bus ${tr.line}` : tr.line;
    const status = tr.oos ? "Not carrying passengers" : Number.isNaN(late) ? "No delay data"
      : late >= 0 ? `${late.toFixed(1)} min late` : `${(-late).toFixed(1)} min early`;
    return {html: `<b>${name}</b> (${tr.mode})<br>${status}`, style: {fontSize: "13px"}};
  },
});

const slider = document.getElementById("slider"), playBtn = document.getElementById("play"), speedSel = document.getElementById("speed");
let now = 0, playing = false, lastFrame = null, lastCounts = {};

function drawChips() {
  document.getElementById("chips").innerHTML = MODES.slice().reverse().map(m => {
    const st = state[m.mode], cls = ["chip", st.on && "on", st.status === "loading" && "loading", st.status === "missing" && "missing"].filter(Boolean).join(" ");
    const n = st.status === "ready" && st.on ? (lastCounts[m.mode] || 0) : "";
    const title = st.status === "missing" ? "No data collected yet" : "Click to show or hide";
    return `<button class="${cls}" data-mode="${m.mode}" title="${title}">${m.label} <span class="n">${n}</span></button>`;
  }).join(" ");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => setMode(b.dataset.mode, !state[b.dataset.mode].on));
}

function setMode(mode, on) {
  const st = state[mode];
  if (st.status === "missing") return;
  st.on = on;
  if (on && st.status === "idle") load(MODES.find(m => m.mode === mode));
  drawChips(); render();
}

function render() {
  const pts = positionsAt(now, document.getElementById("oos").checked);
  map.setProps({layers: [basemap, network, new deck.ScatterplotLayer({
    id: "vehicles", data: pts, getPosition: d => [d.lon, d.lat], getFillColor: colour, getRadius: d => d.tr.r,
    radiusUnits: "pixels", stroked: true, getLineColor: outline, lineWidthMinPixels: 1, pickable: true,
  })]});
  if (!t1) { document.getElementById("time").textContent = "Loading…"; return; }
  const when = new Date(now * 1000);
  document.getElementById("time").textContent = fmtTime.format(when);
  document.getElementById("date").textContent = fmtDate.format(when);
  const running = pts.filter(d => !d.tr.oos), late = running.filter(d => d.late >= 5).length;
  const counts = {};
  running.forEach(d => counts[d.tr.mode] = (counts[d.tr.mode] || 0) + 1);
  if (JSON.stringify(counts) !== JSON.stringify(lastCounts)) { lastCounts = counts; drawChips(); }
  document.getElementById("count").textContent = `${running.length.toLocaleString()} vehicles running, ${late} 5+ min late`;
  const shownStatus = MODES.filter(m => state[m.mode].on && state[m.mode].status === "ready").map(m => state[m.mode]);
  const outside = shownStatus.length && shownStatus.every(st => now < st.start || now > st.end);
  document.getElementById("gap").textContent = !covered[Math.floor((now - t0) / 60)] || outside ? "No data collected at this time" : "";
  slider.value = now;
}

function tick(ts) {
  if (!playing) return;
  if (lastFrame !== null) {
    now += (ts - lastFrame) / 1000 * Number(speedSel.value);
    if (!covered[Math.floor((now - t0) / 60)]) now = nextCovered(now);
    if (now >= t1) { now = t1; playing = false; playBtn.textContent = "Play"; }
  }
  lastFrame = ts;
  render();
  if (playing) requestAnimationFrame(tick);
}

playBtn.onclick = () => {
  if (!t1) return;
  if (!playing && now >= t1) now = startTime();
  playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; lastFrame = null;
  if (playing) requestAnimationFrame(tick);
};
slider.oninput = () => { now = Number(slider.value); render(); };
document.getElementById("oos").onchange = render;
document.getElementById("all").onclick = () => MODES.forEach(m => setMode(m.mode, true));
document.getElementById("none").onclick = () => MODES.forEach(m => setMode(m.mode, false));
drawChips();
// Trains first so the map appears quickly; buses are the biggest file
["Trains", "Metro", "TrainLink", "Light rail", "Ferry", "Bus"].forEach(mode => load(MODES.find(m => m.mode === mode)));
render();
</script>
</body>
</html>
